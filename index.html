<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f62a8">
<meta name="description" content="Eventos para famílias e crianças no Porto, feito à mão.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Quicksand:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MINImapp">
<title>MINImapp</title>
<style>
  :root {
    --bg: #fcf3b6;
    --primary: #2f62a8;
    --primary-2: #234c86;
    --card: #ffffff;
    --accent: #d99a2b;
    --orange: #e8611f;
    --yellow: #f5b921;
    --ink: #17324f;
    --muted: #62717f;
    --line: #e6dfa0;
    --kids: #1f6b3d;
    --kids-bg: #e7f1ea;
    --adults: #b5780f;
    --adults-bg: #f6ece0;
    --danger: #c0392b;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    overscroll-behavior-y: none;
  }
  #app { max-width: 480px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); position: relative; }

  /* ---------- header ---------- */
  .app-header {
    flex: none;
    position: relative;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 18px 12px;
    background: var(--bg);
    color: var(--ink);
  }
  .app-header::before {
    content: ''; position: absolute; top: 0; left: -10%; width: 120%; height: 3px; overflow: hidden;
    background-image: linear-gradient(90deg, var(--orange) 0 12px, transparent 12px 20px);
    background-size: 20px 3px; background-repeat: repeat-x; transform: rotate(-2deg); z-index: 0;
  }
  .corner-ribbon { position: absolute; top: 0; right: 0; width: 60px; height: 60px; background: var(--primary); clip-path: polygon(0 0, 100% 0, 100% 100%); border: none; padding: 0; cursor: pointer; z-index: 6; }
  .corner-ribbon span { position: absolute; top: 10px; right: -14px; width: 78px; display: block; text-align: center; transform: rotate(45deg); color: #fff; font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em; }
  .brand-row { display:flex; align-items:center; justify-content:space-between; gap: 10px; margin: 10px 0 14px; }
  .brand { display:flex; align-items:center; gap: 7px; min-width: 0; }
  .brand-logo { width: 30px; height: 34px; flex: none; }
  .brand-word { font-family: 'Baloo 2', system-ui, sans-serif; font-size: 19px; font-weight: 800; color: var(--primary); white-space: nowrap; }
  .brand-word .mapp { font-family: 'Quicksand', system-ui, sans-serif; font-weight: 600; opacity: 0.85; }
  .city-pill-wrap { position: relative; flex: none; margin-right: 34px; }
  .city-pill { display:flex; align-items:center; gap: 6px; font-size: 13px; font-weight: 800; padding: 9px 14px; border-radius: 14px; background: var(--primary); color: #fff; border: none; font-family: inherit; cursor: pointer; white-space: nowrap; }
  .city-pill .car { font-size: 9px; transition: transform 0.15s; display:inline-block; }
  .city-pill.open .car { transform: rotate(180deg); }
  .city-menu { position: absolute; top: calc(100% + 6px); right: 0; background: var(--primary); border-radius: 16px; padding: 7px; min-width: 168px; box-shadow: 0 12px 28px rgba(23,50,79,0.3); z-index: 30; }
  .city-menu button { display:flex; align-items:center; gap: 10px; width: 100%; text-align:left; background:none; border:none; color:#fff; font-size: 14px; font-weight: 700; padding: 9px 8px; border-radius: 10px; font-family: inherit; cursor: pointer; }
  .city-menu button:active { background: rgba(255,255,255,0.14); }
  .city-radio { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.65); flex: none; display:flex; align-items:center; justify-content:center; }
  .city-radio.on { border-color: #fff; }
  .city-radio.on::after { content:''; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }

  /* ---------- search + filter trigger ---------- */
  .filter-controls { flex: none; background: var(--bg); }
  .icon-row { display:flex; align-items:center; gap: 9px; padding: 0 18px 10px; }
  .search-pill { flex: 1; display:flex; align-items:center; gap: 8px; background: var(--primary); border-radius: 13px; padding: 0 14px; height: 44px; min-width: 0; }
  .search-pill input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: #fff; font-size: 13.5px; font-family: inherit; }
  .search-pill input::placeholder { color: rgba(255,255,255,0.8); }
  .search-pill .sic { color: #fff; font-size: 15px; flex: none; }
  .filtros-btn { flex: none; width: 44px; height: 44px; border-radius: 13px; background: #fff; border: 1px solid var(--line); color: var(--primary); display:flex; align-items:center; justify-content:center; cursor: pointer; position: relative; }
  .filtros-btn .count { position:absolute; top:-5px; right:-5px; background: var(--orange); color:#fff; font-size: 9px; font-weight: 800; border-radius: 999px; min-width:15px; height:15px; display:flex; align-items:center; justify-content:center; padding: 0 3px; }

  /* ---------- active filter chips ---------- */
  .active-chips { display:flex; gap: 7px; padding: 0 18px 10px; overflow-x: auto; }
  .active-chips::-webkit-scrollbar { display: none; }
  .active-chip { flex: none; display:flex; align-items:center; gap: 6px; font-size: 11.5px; font-weight: 700; padding: 6px 6px 6px 12px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .active-chip.a { background: var(--primary); }
  .active-chip.b { background: var(--orange); }
  .active-chip button { border: none; background: rgba(255,255,255,0.25); color: #fff; font-size: 10px; width:16px; height:16px; border-radius:50%; cursor: pointer; line-height: 1; display:flex; align-items:center; justify-content:center; padding:0; }

  /* ---------- seg (list/map/calendar toggle) ---------- */
  .seg { display:flex; margin: 2px 18px 10px; border-radius: 12px; padding: 3px; background: #ece4a8; position: sticky; top: 0; z-index: 3; }
  .seg::before { content: ''; position: absolute; left: -18px; right: -18px; top: -2px; bottom: 0; background: var(--bg); z-index: -1; }
  .seg button { flex:1; display:flex; align-items:center; justify-content:center; gap:5px; font-size:12.5px; font-weight:800; padding:9px 0; border-radius:9px; border:none; background:transparent; color: var(--primary); font-family: inherit; cursor: pointer; }
  .seg button.on { background: var(--primary); color: #fff; }

  /* ---------- calendar ---------- */
  .cal-wrap { padding: 0 18px; }
  .cal-card { background: #fff; border: 2px solid var(--primary); border-radius: 18px; padding: 14px; }
  .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
  .cal-header button { background: none; border: none; font-size: 17px; color: var(--primary); cursor: pointer; padding: 4px 10px; font-family: inherit; }
  .cal-month-label { font-family: 'Baloo 2', system-ui, sans-serif; font-size: 19px; font-weight: 800; color: var(--primary); }
  .cal-grid { display:grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 44px; row-gap: 4px; column-gap: 2px; text-align: center; }
  .cal-dow { font-size: 10.5px; font-weight: 800; color: var(--orange); padding-bottom: 6px; }
  .cal-day { position: relative; width: 100%; height: 100%; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--ink); cursor: pointer; border-radius: 999px; background: none; border: none; font-family: inherit; box-sizing: border-box; }
  .cal-day.empty { visibility: hidden; cursor: default; }
  .cal-day.today { background: var(--orange); color: #fff; }
  .cal-day.selected { background: var(--yellow); color: #5c3d05; }
  .cal-day .dot { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--primary); }
  .cal-day.today .dot, .cal-day.selected .dot { background: #fff; }
  .cal-selected-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); padding: 14px 0 8px; }

  /* ---------- filter overlay panel ---------- */
  .filter-overlay-backdrop { position:absolute; inset:0; background: rgba(23,50,79,0.32); z-index: 25; display:none; }
  .filter-overlay-backdrop.open { display:block; }
  .filter-panel { position:absolute; top: 128px; left: 18px; right: 18px; max-height: 72%; overflow-y:auto; background: rgba(47,98,168,0.95); border-radius: 20px; padding: 18px 16px; color:#fff; box-shadow: 0 16px 40px rgba(23,50,79,0.35); }
  .filter-panel-title { display:flex; align-items:center; gap: 8px; font-size: 15.5px; font-weight: 800; margin-bottom: 14px; }
  .fp-close { position:absolute; top: 14px; right: 14px; background:none; border:none; color:#fff; font-size: 15px; cursor:pointer; opacity: 0.85; }
  .fp-section { margin-bottom: 14px; }
  .fp-section:last-child { margin-bottom: 0; }
  .fp-label { font-size: 11px; font-weight: 800; opacity: 0.8; margin-bottom: 8px; }
  .fp-row { display:flex; gap: 8px; flex-wrap: wrap; align-items:center; }
  .fp-pill { padding: 9px 14px; border-radius: 12px; font-size: 12.5px; font-weight: 800; border: none; font-family: inherit; cursor: pointer; background: rgba(255,255,255,0.18); color: #fff; }
  .fp-pill.on { background: #fff; color: var(--primary); }
  .fp-pill.orange { background: var(--orange); color: #fff; }
  .fp-pill.orange.on { background: #fff; color: var(--orange); }
  .fp-pill.yellow { background: var(--yellow); color: #5c3d05; }
  .fp-pill.yellow.on { background: #fff; color: #8a6006; }
  .fp-add-circle { width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(255,255,255,0.22); color: #fff; font-size: 19px; font-weight: 800; cursor: pointer; }

  /* ---------- date-range picker modal ---------- */
  .date-picker-backdrop { position:absolute; inset:0; background: rgba(23,50,79,0.4); z-index: 45; display:none; align-items:center; justify-content:center; padding: 0 18px; }
  .date-picker-backdrop.open { display:flex; }
  .dp-card { position:relative; background:#fff; border-radius: 22px; padding: 18px 16px 16px; width: 100%; max-width: 360px; box-shadow: 0 16px 40px rgba(23,50,79,0.35); }
  .dp-title { display:flex; align-items:center; gap: 8px; font-size: 15.5px; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
  .dp-close { position:absolute; top: 14px; right: 14px; background:none; border:none; color: var(--muted); font-size: 15px; cursor:pointer; }
  .dp-hint { font-size: 11.5px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
  .dp-actions { display:flex; gap: 10px; margin-top: 14px; }
  .cal-day.range-start, .cal-day.range-end { background: var(--yellow); color: #5c3d05; }
  .cal-day.range-start { border-radius: 999px 0 0 999px; }
  .cal-day.range-end { border-radius: 0 999px 999px 0; }
  .cal-day.range-start.range-end { border-radius: 999px; }
  .cal-day.in-range { background: #fdf0c2; border-radius: 0; color: var(--ink); }

  /* ---------- age stepper modal ---------- */
  .stepper-backdrop { position:absolute; inset:0; background: rgba(23,50,79,0.4); z-index: 40; display:none; align-items:center; justify-content:center; }
  .stepper-backdrop.open { display:flex; }
  .stepper-card { background: var(--primary); border-radius: 22px; padding: 16px 26px 22px; color: #fff; text-align:center; min-width: 210px; }
  .stepper-handle { width: 32px; height: 4px; background: rgba(255,255,255,0.4); border-radius: 999px; margin: 0 auto 12px; }
  .stepper-title { font-size: 12.5px; font-weight: 700; opacity: 0.85; margin-bottom: 10px; }
  .stepper-controls { display:flex; align-items:center; justify-content:center; gap: 20px; margin-bottom: 14px; }
  .stepper-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(255,255,255,0.2); color: #fff; font-size: 19px; font-weight: 800; cursor: pointer; }
  .stepper-value { font-size: 32px; font-weight: 800; min-width: 48px; }
  .stepper-confirm { width: 40px; height: 40px; border-radius: 50%; border: none; background: #fff; color: var(--primary); font-size: 17px; cursor: pointer; margin: 0 auto; display:flex; align-items:center; justify-content:center; }
  .stepper-remove { margin-top: 10px; background: rgba(255,255,255,0.18); color:#fff; border:none; border-radius: 10px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }

  /* ---------- list ---------- */
  .content { flex: 1; overflow-y: auto; padding-bottom: 12px; -webkit-overflow-scrolling: touch; }
  .section-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); padding: 14px 18px 8px; }
  .empty { padding: 40px 24px; text-align:center; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  .list { padding: 0 18px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: 2px solid var(--primary); border-radius: 18px; padding: 12px; display:flex; gap:11px; cursor: pointer; text-align: left; }
  .card:nth-child(even) { border-color: var(--orange); }
  .thumb { width: 54px; height: 54px; border-radius: 12px; flex: none; display:flex; align-items:center; justify-content:center; font-size: 22px; background: #e7eef5; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-body { flex: 1; min-width: 0; }
  .card-title { font-size: 13.5px; font-weight: 800; margin: 0 0 3px; line-height: 1.3; color: var(--primary); }
  .card-meta { font-size: 11.5px; margin: 0 0 8px; color: var(--muted); }
  .card-saved-date {
    display: block; font-size: 11px; font-weight: 800; margin: -3px 0 8px; color: var(--accent);
    background: none; border: none; padding: 0; font-family: inherit; text-align: left; cursor: pointer;
  }
  .card-saved-date .edit-date-hint { opacity: 0.55; font-weight: 600; }
  .card-tags { display:flex; gap: 5px; flex-wrap: wrap; }
  .tag { font-size: 9.5px; font-weight: 800; padding: 4px 9px; border-radius: 999px; }
  .tag.kids { background: var(--kids-bg); color: var(--kids); }
  .tag.adults { background: var(--adults-bg); color: var(--adults); }
  .tag.cat { background: var(--yellow); color: #5c3d05; }
  .tag.when { background: var(--primary); color: #fff; }
  .tag.price-free { background: var(--kids-bg); color: var(--kids); }
  .tag.price-paid { background: #eef3f8; color: var(--primary); }
  .tag.price-unknown { background: #f1f1ee; color: var(--muted); }
  .heart { flex: none; align-self: flex-start; background: none; border: none; font-size: 18px; cursor: pointer; padding: 2px; color: #c7d2dc; }
  .heart.on { color: var(--orange); }
  /* Calendar day-list: force every event card to the same height regardless of
     how long its title/venue text is, so the day's list reads as a clean, even row. */
  .cal-wrap .list { padding: 0; }
  .cal-wrap .list .card { min-height: 108px; align-items: center; }
  .cal-wrap .list .card-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-wrap .list .card-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-wrap .list .card-saved-date { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-wrap .list .card-tags { height: 44px; overflow: hidden; align-content: flex-start; }

  .group { margin-bottom: 6px; }

  /* ---------- explore map ---------- */
  .map-wrap { padding: 0 18px; position: relative; z-index: 0; }
  #exploreMap { width: 100%; height: 62vh; min-height: 320px; border-radius: 16px; border: 1px solid var(--line); background: #e7eef5; }
  /* Leaflet's own panes/markers/controls use z-index up to ~1000 internally.
     Without this, .leaflet-container (position:relative, z-index:auto) never
     forms its own stacking context, so those high internal z-index values
     get compared directly against the page's overlays (filter panel, modals,
     etc.) instead of staying contained inside the map — which let map pins
     render on top of the filter panel. Pinning z-index:0 here (position is
     already relative via leaflet.css) contains everything Leaflet does. */
  .leaflet-container { z-index: 0; }
  .pf-pin { width: 34px; height: 34px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--primary); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(15,36,56,0.35); display:flex; align-items:center; justify-content:center; }
  .pf-pin span { transform: rotate(45deg); font-size: 15px; }
  .pf-pin.cat-artes { background: #b5780f; }
  .pf-pin.cat-movimento { background: #1f6b3d; }
  .pf-pin.cat-oficinas { background: var(--primary); }
  .pf-pin.cat-outro { background: #7a4fae; }
  .map-popup { min-width: 170px; }
  .map-popup .mp-title { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 3px; line-height: 1.3; }
  .map-popup .mp-meta { font-size: 11px; color: var(--muted); margin-bottom: 8px; line-height: 1.4; }
  .map-popup button { width: 100%; font-size: 12px; font-weight: 700; padding: 7px 0; border-radius: 8px; border: none; background: var(--primary); color: #fff; cursor: pointer; font-family: inherit; }
  .leaflet-popup-content { margin: 10px 12px; }

  /* ---------- nav ---------- */
  .navbar { flex: none; display:flex; padding: 10px 6px calc(env(safe-area-inset-bottom, 0px) + 10px); background: #f2ecc4; border-top: 1px solid var(--line); position: relative; overflow: hidden; }
  .navbar-squiggle { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .navitem { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size: 10px; font-weight: 800; background: none; border: none; color: var(--muted); font-family: inherit; cursor: pointer; padding: 4px 0; z-index: 1; }
  .navitem .ic { font-size: 18px; }
  .navitem.active { color: var(--primary); }

  /* ---------- splash screen ---------- */
  .splash-screen {
    position: absolute; inset: 0; z-index: 100; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; opacity: 1; transition: opacity 0.5s ease;
  }
  .splash-screen.hide { opacity: 0; pointer-events: none; }
  .splash-dash { position: absolute; height: 3px; width: 140%; left: -20%;
    background-image: linear-gradient(90deg, var(--orange) 0 12px, transparent 12px 20px);
    background-size: 20px 3px; background-repeat: repeat-x; }
  .splash-dash.top { top: 26px; transform: rotate(-4deg); }
  .splash-dash.bottom { bottom: 30px; transform: rotate(-4deg); }
  .splash-cloud { position: absolute; opacity: 0.9; }
  .splash-word { font-family: 'Baloo 2', system-ui, sans-serif; font-size: 30px; font-weight: 800; color: var(--primary); margin-top: 18px; }
  .splash-word .mapp { font-family: 'Quicksand', system-ui, sans-serif; font-weight: 600; opacity: 0.85; }
  .splash-figure { width: 130px; height: auto; }

  /* ---------- detail modal ---------- */
  .modal-backdrop {
    position: absolute; inset: 0; background: rgba(15,36,56,0.4);
    display: none; align-items: flex-end; z-index: 20;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff; width: 100%; max-height: 86%; overflow-y: auto;
    border-radius: 22px 22px 0 0; padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
    border: 2px solid var(--primary); border-bottom: none;
  }
  .modal-handle-zone { display: flex; justify-content: center; padding: 10px 0 14px; cursor: pointer; margin: -10px -20px 0; }
  .modal-handle { width: 36px; height: 4px; background: var(--line); border-radius: 999px; }
  .modal .m-thumb { width: 100%; height: 120px; border-radius: 14px; background: #e7eef5; display:flex; align-items:center; justify-content:center; font-size: 40px; margin-bottom: 14px; position: relative; overflow: hidden; }
  .modal .m-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; }
  .modal .m-thumb .heart { position:absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.85); border-radius: 50%; }
  .modal h2 { font-size: 18px; margin: 4px 0 8px; color: var(--primary); }
  .modal .m-meta { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
  .modal .m-meta .pin { color: var(--orange); }
  .modal .m-tags { display:flex; gap:6px; flex-wrap: wrap; margin-bottom: 14px; }
  .modal .m-desc { font-size: 13.5px; line-height: 1.6; color: var(--ink); margin-bottom: 16px; }
  .modal .m-actions { display:flex; gap: 10px; }
  .btn { flex:1; text-align:center; padding: 12px; border-radius: 12px; font-size: 13.5px; font-weight: 700; border: none; font-family: inherit; cursor: pointer; text-decoration: none; display:block; }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.ghost { background: #eef3f8; color: var(--primary); }

  /* ---------- profile ---------- */
  .profile-section-label { margin: 18px 18px 8px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .profile-section-label:first-child { margin-top: 6px; }
  .profile-card { margin: 6px 18px 14px; background: var(--card); border: 2px solid var(--primary); border-radius: 16px; padding: 16px; }
  .profile-card h3 { font-size: 13.5px; margin: 0 0 6px; color: var(--primary); }
  .profile-card p { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin: 0 0 10px; }
  .profile-card a.btn { display:block; }

  // Map of event id -> { start: 'YYYY-MM-DD', end: 'YYYY-MM-DD' }, the date
  // (or date range) the user chose when saving that event.
  saved: (() => {
    const raw = JSON.parse(localStorage.getItem('pf_saved') || '[]');
    const map = new Map();
    raw.forEach((entry) => {
      if (Array.isArray(entry)) {
        // Current format: [id, { start, end }] pairs.
        map.set(entry[0], entry[1] || { start: null, end: null });
      } else {
        // Legacy format from before dated saves existed: a bare id number.
        map.set(entry, { start: null, end: null });
      }
    });

   Project: minimappkids (Firebase console → Project settings → General →
   Your apps → Web app → firebaseConfig). Until Email link sign-in is
   enabled and app.minimappkids.com is added under Authorized domains,

   surfaces that as a translated error rather than crashing. */
const firebaseConfig = {
  apiKey: 'AIzaSyAJm8YT6W-yUK0BohEZpGNXVJlWoHjrFaQ',
  authDomain: 'minimappkids.firebaseapp.com',
  projectId: 'minimappkids',

  measurementId: 'G-BX4ZVDTP0L',
};
const AUTH_EMAIL_STORAGE_KEY = 'pf_auth_email_pending';
let authReady = false;
try {
  if (window.firebase && firebaseConfig.apiKey !== 'REPLACE_ME') {
    firebase.initializeApp(firebaseConfig);
    authReady = true;
  }
} catch (e) { /* leave authReady false — app still works fully logged-out */ }

function currentAuth() { return authReady ? firebase.auth() : null; }

function isValidEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }

async function sendSignInLink(email) {
  const auth = currentAuth();
  if (!auth) { state.authModalView = 'error'; state.authError = t('authGenericError'); render(); return; }
  if (!isValidEmail(email)) { state.authModalView = 'error'; state.authError = t('authInvalidEmail'); render(); return; }
  const actionCodeSettings = {
    url: window.location.origin + window.location.pathname,
    handleCodeInApp: true,
  };
  try {
    await auth.sendSignInLinkToEmail(email, actionCodeSettings);
    localStorage.setItem(AUTH_EMAIL_STORAGE_KEY, email);
    state.authPendingEmail = email;
    state.authModalView = 'sent';
    state.authError = null;
  } catch (e) {
    state.authModalView = 'error';
    state.authError = t('authGenericError');
  }
  render();
}

// Called once on page load, before the first render — completes sign-in if
// the page was opened from the emailed magic link.
async function completeSignInFromLinkIfPresent() {
  const auth = currentAuth();
  if (!auth) return;
  if (!auth.isSignInWithEmailLink(window.location.href)) return;
  let email = localStorage.getItem(AUTH_EMAIL_STORAGE_KEY);
  if (!email) {
    // Link opened on a different device than it was requested from — Firebase
    // can't know the email without asking again.
    email = window.prompt(t('authOpenOnThisDevice') + ' — ' + t('authEmailPlaceholder'));
  }
  if (!email) return;

/* ===================== DATE HELPERS ===================== */
function todayMidnight() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}
function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
// Does event ev cover calendar day `target` (a Date at midnight)?
function coversDay(ev, target) {
  if (ev.ongoing) return true;
  const t = target.getTime();
  if (ev.dateStart && ev.dateEnd) {
    return t >= new Date(ev.dateStart + 'T00:00:00').getTime() && t <= new Date(ev.dateEnd + 'T00:00:00').getTime();
  }
  if (ev.date) {
    return new Date(ev.date + 'T00:00:00').getTime() === t;
  }
  return true;
}
// Does saved event ev fall on calendar day `target`, per the date (or date
// range) the user chose when they saved it — not the event's own schedule.
// Used only by the Saved tab's calendar, so recurring/ongoing events don't
// flood every day and instead show up only where the user placed them.
function coversSavedDay(ev, target) {
  const info = state.saved.get(ev.id);
  if (!info || !info.start) return false;
  const t = target.getTime();
  const s = new Date(info.start + 'T00:00:00').getTime();
  const e = new Date((info.end || info.start) + 'T00:00:00').getTime();
  return t >= s && t <= e;
}
// Does event ev overlap at all with the [startIso, endIso] range (inclusive)?
function overlapsRange(ev, startIso, endIso) {
  if (ev.ongoing) return true;
  const start = new Date(startIso + 'T00:00:00').getTime();
  const end = new Date(endIso + 'T00:00:00').getTime();
  if (ev.dateStart && ev.dateEnd) {
    const es = new Date(ev.dateStart + 'T00:00:00').getTime();
    const ee = new Date(ev.dateEnd + 'T00:00:00').getTime();
    return es <= end && ee >= start;
  }
  if (ev.date) {
    const d = new Date(ev.date + 'T00:00:00').getTime();
    return d >= start && d <= end;
  }
  return true;
}
// Dated events that finished before today quietly drop out of every view (ongoing ones never do).
function isPastEvent(ev) {
  if (ev.ongoing) return false;
  const endStr = ev.dateEnd || ev.date;
  if (!endStr) return false;
  return new Date(endStr + 'T00:00:00').getTime() < todayMidnight().getTime();
}
function matchesDate(ev) {
  const today = todayMidnight();
  switch (state.dateMode) {
    case 'all': return true;
    case 'today': return coversDay(ev, today);
    case 'weekend': {
      const day = today.getDay(); // 0 Sun .. 6 Sat
      const satOffset = day === 6 ? 0 : (6 - day + 7) % 7;
      const sunOffset = day === 0 ? 0 : (7 - day) % 7;
      return coversDay(ev, addDays(today, satOffset)) || coversDay(ev, addDays(today, sunOffset));
    }
    case 'range':
      if (!state.rangeStart) return true;
      return overlapsRange(ev, state.rangeStart, state.rangeEnd || state.rangeStart);
    default: return true;
  }
}

/* ===================== FILTER LOGIC ===================== */
// With no children set, no age filtering happens (kids + adult events both show).
// With one or more children set, an event matches if it's a good fit for at
// least one of them (its age range overlaps that child's age).
function ageMatches(ev) {
  if (!state.childAges.length) return true;
  const lo = typeof ev.ageMin === 'number' ? ev.ageMin : 0;
  const hi = typeof ev.ageMax === 'number' ? ev.ageMax : Infinity;
  return state.childAges.some(age => age >= lo && age <= hi);
}
function matches(ev, opts) {
  opts = opts || {};
  if (ev.city !== state.city) return false;
  if (isPastEvent(ev)) return false;
  if (!ageMatches(ev)) return false;
  if (state.cats.size && !state.cats.has(ev.cat)) return false;
  if (state.subFilters.size && !state.subFilters.has(ev.sub)) return false;
  // Only events we've confirmed are free are shown here — unconfirmed pricing
  // never gets labelled "free" just to fill out the filter.
  if (state.freeOnly && ev.free !== true) return false;
  if (state.locationFilter === 'indoor' && ev.indoor !== true) return false;
  if (state.locationFilter === 'outdoor' && ev.indoor !== false) return false;
  if (!opts.ignoreDate && !matchesDate(ev)) return false;
  if (state.search.trim()) {
    const q = state.search.trim().toLowerCase();
    const hay = `${ev.title} ${ev.title_en || ''} ${ev.venue}`.toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
// Calendar view picks its own date via the day grid, so it ignores dateMode
// (today/weekend/custom) and shows the month regardless — only the other
// filters (age, category, free, indoor/outdoor, search) still apply.
function matchesForCalendar(ev) { return matches(ev, { ignoreDate: true }); }
function todayIso() {
  const d = todayMidnight();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// Saved-event reminders: a lightweight, in-app-only nudge (no push/backend) —
// events with a specific date show a badge when they land today or tomorrow.
function eventHappensOn(ev, day) {
  if (ev.ongoing) return false;
  return coversDay(ev, day);
}
function reminderBadgeFor(ev) {
  const today = todayMidnight();
  if (eventHappensOn(ev, today)) return 'today';
  if (eventHappensOn(ev, addDays(today, 1))) return 'tomorrow';
  return null;
}
function savedReminders() {
  const today = todayMidnight();
  const tomorrow = addDays(today, 1);
  const savedEvents = EVENTS.filter(ev => state.saved.has(ev.id) && !isPastEvent(ev));
  return {
    todayList: savedEvents.filter(ev => eventHappensOn(ev, today)),
    tomorrowList: savedEvents.filter(ev => eventHappensOn(ev, tomorrow)),
  };
}

function savedDateHtml(ev) {
  const info = state.saved.get(ev.id);
  if (!info || !info.start) return '';
  const isRange = info.end && info.end !== info.start;

    ? `${formatDate(info.start)} – ${formatDate(info.end)}`
    : formatDate(info.start);
  // Tapping this re-opens the date picker to change it — saving itself
  // defaults to today instantly, with no picker in the way.
  return `<button type="button" class="card-saved-date" data-edit-date="${ev.id}">📌 ${t('savedForLabel')} ${label} <span class="edit-date-hint">✎</span></button>`;
}

  return `

}

// Shared month-grid builder used by both the Calendário tab and the date-range
// picker modal. dotPool is the set of events to check for the "has events" dot
// (pass null to skip dots); dayClassFn(iso, dateObj) returns extra CSS classes
// for a given day button (selection/range highlighting is caller-specific).
function monthGridParts(monthDate, dotPool, dayClassFn, coverFn) {
  coverFn = coverFn || coversDay;
  const year = monthDate.getFullYear();
  const mIdx = monthDate.getMonth();
  // JS getDay() is Sunday-first (0=Sun..6=Sat); the calendar grid displays
  // Monday-first (Mon..Sun), so shift both the header labels and the leading
  // empty-cell count accordingly.
  const firstDowSun = new Date(year, mIdx, 1).getDay();
  const firstDowMon = (firstDowSun + 6) % 7;
  const daysInMonth = new Date(year, mIdx + 1, 0).getDate();
  const lang = state.lang;
  const monthLabel = `${MONTHS[lang][mIdx]} ${year}`;
  const todayStr = todayIso();
  const weekdaysMonFirst = [...WEEKDAYS[lang].slice(1), WEEKDAYS[lang][0]];
  const dowHtml = weekdaysMonFirst.map(d => `<div class="cal-dow">${d}</div>`).join('');

  let cellsHtml = '';
  for (let i = 0; i < firstDowMon; i++) {
    cellsHtml += `<div class="cal-day empty"></div>`;
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const dateObj = new Date(year, mIdx, day);
    dateObj.setHours(0, 0, 0, 0);
    const iso = `${year}-${String(mIdx + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const isToday = iso === todayStr;
    const hasEvents = dotPool ? dotPool.some(ev => coverFn(ev, dateObj)) : false;
    const cls = ['cal-day'];
    if (isToday) cls.push('today');
    if (dayClassFn) { const extra = dayClassFn(iso, dateObj); if (extra) cls.push(extra); }
    cellsHtml += `<button class="${cls.join(' ')}" data-date="${iso}">${day}${hasEvents ? '<span class="dot"></span>' : ''}</button>`;
  }
  return { dowHtml, cellsHtml, monthLabel };
}

function calendarHtml(pool, coverFn) {
  coverFn = coverFn || coversDay;
  if (!state.calendarSelectedDate) state.calendarSelectedDate = todayIso();
  const { dowHtml, cellsHtml, monthLabel } = monthGridParts(
    state.calendarMonth,
    pool,
    (iso) => iso === state.calendarSelectedDate ? 'selected' : '',
    coverFn
  );

  const selectedDateObj = new Date(state.calendarSelectedDate + 'T00:00:00');
  const dayEvents = pool
    .filter(ev => coverFn(ev, selectedDateObj))
    .sort((a, b) => (a.ongoing ? 1 : 0) - (b.ongoing ? 1 : 0));
  const selectedLabel = formatDate(state.calendarSelectedDate);
  const dayListHtml = dayEvents.length
    ? dayEvents.map(cardHtml).join('')
    : `<div class="empty">${t('emptyFilters')}<br>${t('emptyFiltersHint')}</div>`;

  return `
    <div class="cal-wrap">
      <div class="cal-card">
        <div class="cal-header">
          <button id="calPrev" aria-label="prev">‹</button>
          <div class="cal-month-label">${monthLabel}</div>
          <button id="calNext" aria-label="next">›</button>
        </div>
        <div class="cal-grid">${dowHtml}${cellsHtml}</div>
      </div>
      <div class="cal-selected-label">${selectedLabel}</div>
      <div class="list">${dayListHtml}</div>
    </div>
  `;
}

function openDatePicker() {
  state.datePickerMonth = new Date(state.rangeStart || todayIso() + 'T00:00:00');
  state.datePickerMonth.setDate(1);
  state.datePickerMonth.setHours(0, 0, 0, 0);
  state.datePickerOpen = true;
  render();
}
// Two-tap range picker: first tap starts a fresh single-day pick; a second tap
// (while only a single day is selected) sets the other end, swapping if it's
// earlier than the start; tapping again after a full range starts over.
function pickDatePickerDay(iso) {
  const hasFullRange = state.rangeStart && state.rangeEnd && state.rangeStart !== state.rangeEnd;
  if (state.dateMode !== 'range' || !state.rangeStart || hasFullRange) {
    state.rangeStart = iso;
    state.rangeEnd = iso;
  } else if (iso === state.rangeStart) {
    // tap the same single day again: leave it as a single-day selection
  } else if (iso < state.rangeStart) {
    state.rangeEnd = state.rangeStart;
    state.rangeStart = iso;
  } else {
    state.rangeEnd = iso;
  }
  state.dateMode = 'range';
  render();
}
function renderDatePicker() {
  const backdrop = document.getElementById('datePickerBackdrop');
  backdrop.classList.toggle('open', state.datePickerOpen);
  if (!state.datePickerOpen) { backdrop.innerHTML = ''; return; }
  const dayClass = (iso) => {
    if (!state.rangeStart) return '';
    const end = state.rangeEnd || state.rangeStart;
    if (state.rangeStart === end) return iso === state.rangeStart ? 'range-start range-end' : '';
    if (iso === state.rangeStart) return 'range-start';
    if (iso === end) return 'range-end';
    if (iso > state.rangeStart && iso < end) return 'in-range';
    return '';
  };
  const { dowHtml, cellsHtml, monthLabel } = monthGridParts(state.datePickerMonth, null, dayClass);
  backdrop.innerHTML = `

  `;
  backdrop.onclick = (e) => { if (e.target === backdrop) { state.datePickerOpen = false; render(); } };
  document.getElementById('dpClose').onclick = () => { state.datePickerOpen = false; render(); };
  document.getElementById('dpPrev').onclick = () => {

/* ---------- save-date picker (shown when hearting an event to save it) ---------- */
// Opens the picker to CHANGE the date on an already-saved event (reached by
// tapping its "Saved for..." badge) — saving itself no longer goes through
// this picker, it's instant. Seeds from the event's current saved date so
// editing starts from what's actually saved, not a fresh default.
function openSaveDatePicker(eventId) {
  const ev = EVENTS.find(e => e.id === eventId);
  const existing = state.saved.get(eventId);
  const seed = (existing && existing.start) || (ev && ev.date) || todayIso();
  state.saveDatePickerEventId = eventId;
  state.saveDatePickerMonth = new Date(seed + 'T00:00:00');
  state.saveDatePickerMonth.setDate(1);
  state.saveDatePickerMonth.setHours(0, 0, 0, 0);
  state.saveDateStart = seed;
  state.saveDateEnd = (existing && existing.end) || (ev && ev.dateEnd) || seed;
  state.saveDateUserPicked = false;
  state.saveDatePickerOpen = true;
  render();
}
// The picker opens pre-seeded with a default day (so a single Save tap just
// works) but that default shouldn't count as the user's "first tap" — the
// first day they actually tap should always replace it outright, giving a
// clean single-day pick; only a second tap after that extends it into a
// range. Without this, picking any other single day would look like the
// second tap of a range starting from the default and silently produce one.
function pickSaveDateDay(iso) {
  if (!state.saveDateUserPicked) {
    state.saveDateStart = iso;
    state.saveDateEnd = iso;
    state.saveDateUserPicked = true;
    render();
    return;
  }
  const hasFullRange = state.saveDateStart && state.saveDateEnd && state.saveDateStart !== state.saveDateEnd;
  if (hasFullRange) {
    state.saveDateStart = iso;
    state.saveDateEnd = iso;
  } else if (iso === state.saveDateStart) {
    // tap the same single day again: leave it as a single-day selection
  } else if (iso < state.saveDateStart) {
    state.saveDateEnd = state.saveDateStart;
    state.saveDateStart = iso;
  } else {
    state.saveDateEnd = iso;
  }
  render();
}
function closeSaveDatePicker() {
  state.saveDatePickerOpen = false;
  state.saveDatePickerEventId = null;
  render();
}
function confirmSaveDate() {
  if (state.saveDatePickerEventId != null && state.saveDateStart) {
    state.saved.set(state.saveDatePickerEventId, {
      start: state.saveDateStart,
      end: state.saveDateEnd || state.saveDateStart,
    });
    persistSaved();
  }
  closeSaveDatePicker();
}
function renderSaveDatePicker() {
  const backdrop = document.getElementById('saveDatePickerBackdrop');
  if (!backdrop) return;
  backdrop.classList.toggle('open', state.saveDatePickerOpen);
  if (!state.saveDatePickerOpen) { backdrop.innerHTML = ''; return; }
  const dayClass = (iso) => {
    if (!state.saveDateStart) return '';
    const end = state.saveDateEnd || state.saveDateStart;
    if (state.saveDateStart === end) return iso === state.saveDateStart ? 'range-start range-end' : '';
    if (iso === state.saveDateStart) return 'range-start';
    if (iso === end) return 'range-end';
    if (iso > state.saveDateStart && iso < end) return 'in-range';
    return '';
  };
  const { dowHtml, cellsHtml, monthLabel } = monthGridParts(state.saveDatePickerMonth, null, dayClass);
  backdrop.innerHTML = `
    <div class="dp-card" id="sdpCard">
      <button class="dp-close" id="sdpClose">✕</button>
      <div class="dp-title">📌 ${t('savePickTitle')}</div>

      <div class="cal-card">

        <button class="btn primary" id="sdpConfirm">${t('savePickConfirm')}</button>
      </div>
    </div>
  `;
  backdrop.onclick = (e) => { if (e.target === backdrop) closeSaveDatePicker(); };
  document.getElementById('sdpClose').onclick = () => closeSaveDatePicker();
  document.getElementById('sdpCancel').onclick = () => closeSaveDatePicker();
  document.getElementById('sdpPrev').onclick = () => {
    const d = new Date(state.saveDatePickerMonth); d.setMonth(d.getMonth() - 1); state.saveDatePickerMonth = d; render();
  };
  document.getElementById('sdpNext').onclick = () => {
    const d = new Date(state.saveDatePickerMonth); d.setMonth(d.getMonth() + 1); state.saveDatePickerMonth = d; render();
  };
  backdrop.querySelectorAll('.cal-day[data-date]').forEach(btn => {

function renderExploreMap(list) {
  const container = document.getElementById('exploreMap');
  if (!container) return;
  if (typeof L === 'undefined') {
    container.outerHTML = `<div class="empty">${t('mapUnavailable')}</div>`;
    return;
  }
  if (exploreLeafletMap) {
    exploreLeafletMap.remove();
    exploreLeafletMap = null;
  }
  const map = L.map(container, { scrollWheelZoom: false }).setView([41.1579, -8.6291], 12.5);
  exploreLeafletMap = map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);

  const pinned = list.filter(ev => typeof ev.lat === 'number' && typeof ev.lng === 'number');
  const markers = [];
  pinned.forEach(ev => {
    const catIcon = (CATEGORIES.find(c => c.key === ev.cat) || {}).icon || ev.icon;
    const icon = L.divIcon({
      className: '',
      html: `<div class="pf-pin cat-${ev.cat}"><span>${catIcon}</span></div>`,
      iconSize: [34, 34],
      iconAnchor: [17, 34],
      popupAnchor: [0, -32],
    });
    const marker = L.marker([ev.lat, ev.lng], { icon }).addTo(map);
    marker.bindPopup(`
      <div class="map-popup">
        <div class="mp-title">${ev.icon} ${evTitle(ev)}</div>
        <div class="mp-meta">${ev.venue}<br>${evWhen(ev)}</div>
        <button data-open="${ev.id}">${t('viewDetails')}</button>
      </div>
    `);
    markers.push(marker);
  });
  map.on('popupopen', (e) => {
    const popupEl = e.popup.getElement();
    const btn = popupEl.querySelector('[data-open]');
    if (btn) btn.addEventListener('click', () => openDetail(Number(btn.dataset.open)));
    // Center the popup itself (not just the marker underneath it) in the visible
    // map area, so the details card is never left poking off the edge and the
    // user doesn't have to drag the map to read it.
    const targetPoint = map.project(e.popup.getLatLng(), map.getZoom());
    const popupHeight = popupEl.offsetHeight || 120;
    targetPoint.y -= popupHeight / 2;
    map.panTo(map.unproject(targetPoint, map.getZoom()), { animate: true });
  });
  if (markers.length) {
    map.fitBounds(L.featureGroup(markers).getBounds().pad(0.2), { maxZoom: 15 });
  }
  setTimeout(() => map.invalidateSize(), 50);
}

/* ===================== DETAIL MODAL ===================== */
const backdrop = document.getElementById('modalBackdrop');
const modalEl = document.getElementById('modal');
let openDetailId = null; // id of the event whose detail modal is currently open, if any

// The modal's own content is only rebuilt by openDetail(), not by every
// render() — so after a save/unsave that happens elsewhere (the save-date
// picker confirming, for instance) this keeps its heart icon in sync.
function syncModalHeart() {
  if (openDetailId == null || !backdrop.classList.contains('open')) return;
  const btn = document.getElementById('modalSave');
  if (!btn) return;
  const nowSaved = state.saved.has(openDetailId);
  btn.classList.toggle('on', nowSaved);
  btn.textContent = nowSaved ? '♥' : '♡';
}

function mapsQuery(ev) {
  // Prefer a text query (venue name + city) over raw lat/lng: Google resolves
  // it to the venue's real, verified place listing (correct address, properly
  // centered) rather than an approximate dropped pin from our stored coords,
  // which are often only accurate to 2-3 decimal places (100m+ off).
  const venue = (ev.venue || '').trim();
  if (venue) {
    const cityObj = CITIES.find(c => c.key === ev.city);
    const cityName = cityObj ? cityObj.names.en : '';
    return encodeURIComponent(venue + (cityName ? ', ' + cityName : ''));
  }
  return `${ev.lat},${ev.lng}`;
}

function openDetail(id) {
  const ev = EVENTS.find(e => e.id === id);
  if (!ev) return;
  openDetailId = id;
  const isSaved = state.saved.has(ev.id);
  modalEl.innerHTML = `
    <div class="modal-handle-zone" id="modalHandleZone"><div class="modal-handle"></div></div>
    <div class="m-thumb">
      ${thumbHtml(ev)}
      <button class="heart ${isSaved ? 'on' : ''}" id="modalSave">${isSaved ? '♥' : '♡'}</button>
    </div>
    <h2>${evTitle(ev)}</h2>
    <div class="m-meta"><span class="pin">📍</span> ${ev.venue}<br>${evWhen(ev)}</div>
    <div class="m-tags">${tagsHtml(ev)}</div>
    <div class="m-desc">${evDesc(ev)}</div>
    <div class="m-actions">
      ${ev.source ? `<a class="btn primary" href="${ev.source}" target="_blank" rel="noopener">${t('viewSource')}</a>` : ''}
      <a class="btn ${ev.source ? 'ghost' : 'primary'}" href="https://www.google.com/maps/search/?api=1&query=${mapsQuery(ev)}" target="_blank" rel="noopener">${t('viewOnMap')}</a>
    </div>
  `;
  backdrop.classList.add('open');
  document.getElementById('modalHandleZone').onclick = () => closeDetail();
  document.getElementById('modalSave').onclick = () => {
    // Just flip the heart in place and keep the details open — closing the
    // whole modal is only supposed to happen when tapping outside it. Saving
    // is instant (today's date, no picker); the date can be changed later
    // from the saved-date badge in list view.
    if (state.saved.has(ev.id)) {
      state.saved.delete(ev.id);
    } else {
      const today = todayIso();
      state.saved.set(ev.id, { start: today, end: today });
    }
    persistSaved();
    render();
  };
}
function closeDetail() { backdrop.classList.remove('open'); openDetailId = null; }
backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeDetail(); });

/* ===================== EVENTS ===================== */
document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  render();
});
document.querySelectorAll('.navitem').forEach(btn => {
  btn.addEventListener('click', () => {
    state.tab = btn.dataset.tab;
    if (btn.dataset.tab === 'home' && state.search) {
      state.search = '';
      const si = document.getElementById('searchInput');
      if (si) si.value = '';
    }
    render();
  });
});

/* ===================== INSTALL PROMPT ===================== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBanner').classList.remove('show');
});

/* ===================== SERVICE WORKER ===================== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

/* ===================== SPLASH SCREEN ===================== */
setTimeout(() => {
  const splash = document.getElementById('splashScreen');
  if (!splash) return;
  splash.classList.add('hide');
  setTimeout(() => splash.remove(), 550);
}, 1500);

/* ===================== INIT ===================== */
// Event data lives in events.json, fetched at runtime, instead of being baked
// into this file — daily content updates only need to touch that small data
// file, not the whole app. Falls back to a cached copy when offline, and
// never lets a data-load failure crash the page (EVENTS just stays []).
async function loadEventsAndInit() {
  try {
    const res = await fetch('events.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('bad response ' + res.status);
    const data = await res.json();
    EVENTS = data;
    if ('caches' in window) {
      caches.open('pf-data-v1')
        .then(c => c.put('events.json', new Response(JSON.stringify(data), { headers: { 'Content-Type': 'application/json' } })))
        .catch(() => {});
    }
  } catch (err) {
    // Network failed (e.g. offline) — fall back to the last cached copy.
    try {
      if ('caches' in window) {
        const cache = await caches.open('pf-data-v1');
        const cached = await cache.match('events.json');
        if (cached) EVENTS = await cached.json();
      }
    } catch (e2) { /* leave EVENTS as [] */ }
  }

  // Reconcile a stored language that isn't valid for the stored city (e.g. after this
  // update introduced per-city languages) before the very first render.
  const validLangs = CITY_LANGS[state.city] || ['en'];
  if (!validLangs.includes(state.lang)) {
    state.lang = validLangs[0];
    localStorage.setItem('pf_lang', state.lang);
    document.documentElement.lang = state.lang;
  }
  render();
}
completeSignInFromLinkIfPresent().finally(loadEventsAndInit);
if (authReady) {
  firebase.auth().onAuthStateChanged((user) => {
    state.user = user ? { email: user.email, uid: user.uid } : null;
    render();
  });
}
</script>
</body>
</html>
