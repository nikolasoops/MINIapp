  const filtrosBadge = activeFilterCount();
  document.getElementById('filtrosBtn').innerHTML = `☰${filtrosBadge ? `<span class="count">${filtrosBadge}</span>` : ''}`;
  document.getElementById('filtrosBtn').onclick = () => { state.filtersOpen = !state.filtersOpen; render(); };
  document.querySelector('.navitem[data-tab="home"]').innerHTML = `<span class="ic">🏠</span>${t('navHome')}`;
  document.querySelector('.navitem[data-tab="saved"]').innerHTML = `<span class="ic">♥</span>${t('navSaved')}`;
  document.querySelector('.navitem[data-tab="profile"]').innerHTML = `<span class="ic">👤</span>${t('navProfile')}`;
  document.querySelector('#installBanner span').textContent = t('installText');
  document.getElementById('installBtn').textContent = t('installBtn');

  const reminderBanner = document.getElementById('reminderBanner');
  if ((state.tab === 'home' || state.tab === 'saved') && state.notifOptIn !== false) {
    const { todayList, tomorrowList } = savedReminders();
    const list = todayList.length ? todayList : tomorrowList;
    if (list.length) {
      const label = todayList.length ? t('reminderToday') : t('reminderTomorrow');
      reminderBanner.innerHTML = `<span>⏰</span><span>${label} ${list.map(evTitle).join(', ')}</span>`;
      reminderBanner.classList.add('show');
    } else {
      reminderBanner.classList.remove('show');
    }
  } else {
    reminderBanner.classList.remove('show');
  }

  if (state.tab === 'home') renderHome();
  else if (state.tab === 'saved') renderSaved();
  else if (state.tab === 'profile') renderProfile();

  renderActiveChips();
  renderFilterPanel();
  renderAgeStepper();
  renderDatePicker();
  renderSaveDatePicker();
  syncModalHeart();

  document.querySelectorAll('.navitem').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === state.tab);
  });
  syncBackGuard();
}

/* ===================== DETAIL MODAL ===================== */
const backdrop = document.getElementById('modalBackdrop');
const modalEl = document.getElementById('modal');
let openDetailId = null; // id of the event whose detail modal is currently open, if any

// The modal's own content is only rebuilt by openDetail(), not by every
// render() — so after a save/unsave that happens elsewhere (the save-date
// picker confirming, for instance) this keeps its heart icon in sync.
function syncModalHeart() {
  if (openDetailId == null || !backdrop.classList.contains('open')) return;
  const btn = document.getElementById('modalSave');
  if (!btn) return;
  const nowSaved = state.saved.has(openDetailId);
  btn.classList.toggle('on', nowSaved);
  btn.textContent = nowSaved ? '♥' : '♡';
}

function mapsQuery(ev) {
  // Prefer a text query (venue name + city) over raw lat/lng: Google resolves
  // it to the venue's real, verified place listing (correct address, properly
  // centered) rather than an approximate dropped pin from our stored coords,
  // which are often only accurate to 2-3 decimal places (100m+ off).
  const venue = (ev.venue || '').trim();
  if (venue) {
    const cityObj = CITIES.find(c => c.key === ev.city);
    const cityName = cityObj ? cityObj.names.en : '';
    return encodeURIComponent(venue + (cityName ? ', ' + cityName : ''));
  }
  return `${ev.lat},${ev.lng}`;
}

/* ---------- 🎲 Surprise me: a random event from what the user is currently
   seeing (same city, ages, filters and dates as the list). Upcoming events with
   a photo are preferred; no repeats until every option has been shown once. */
const surpriseSeen = new Set();
function surprisePool() {
  const list = EVENTS.filter(matches);
  const withPhoto = list.filter(ev => evImages(ev).length);
  return withPhoto.length >= 3 ? withPhoto : list;
}
function surpriseMe() {
  const pool = surprisePool();
  if (!pool.length) return;
  let fresh = pool.filter(ev => !surpriseSeen.has(ev.id) && ev.id !== openDetailId);
  if (!fresh.length) { pool.forEach(ev => surpriseSeen.delete(ev.id)); fresh = pool.filter(ev => ev.id !== openDetailId); }
  if (!fresh.length) fresh = pool;
  const pick = fresh[Math.floor(Math.random() * fresh.length)];
  surpriseSeen.add(pick.id);
  openDetail(pick.id, { surprise: true });
}

function openDetail(id, opts) {
  opts = opts || {};
  const ev = EVENTS.find(e => e.id === id);
  if (!ev) return;
  openDetailId = id;
  const isSaved = state.saved.has(ev.id);
  modalEl.innerHTML = `
    <div class="modal-handle-zone" id="modalHandleZone"><div class="modal-handle"></div></div>
    <div class="m-thumb">
      ${galleryHtml(ev)}
      <button class="heart ${isSaved ? 'on' : ''}" id="modalSave">${isSaved ? '♥' : '♡'}</button>
    </div>
    <h2>${evTitle(ev)}</h2>
    <div class="m-meta"><span class="pin">📍</span> ${ev.venue}<br>${evWhen(ev)}</div>
    <div class="m-tags">${tagsHtml(ev)}</div>
    <div class="m-desc">${evDesc(ev)}</div>
    <div class="m-actions">
      ${ev.source ? `<a class="btn primary" href="${ev.source}" target="_blank" rel="noopener">${t('viewSource')}</a>` : ''}
      <a class="btn ${ev.source ? 'ghost' : 'primary'}" href="https://www.google.com/maps/search/?api=1&query=${mapsQuery(ev)}" target="_blank" rel="noopener">${t('viewOnMap')}</a>
    </div>
    <button class="btn ghost m-share" id="modalShare">${wordOf(WORD_SHARE_EVENT)}</button>
    ${opts.surprise && surprisePool().length > 1 ? `<button class="btn m-again" id="modalAgain" type="button">${ICON_BULB}<span>${wordOf(WORD_TRY_ANOTHER)}</span></button>` : ''}
  `;
  if (opts.surprise) modalEl.scrollTop = 0;
  backdrop.classList.add('open');
  syncBackGuard();
  document.getElementById('modalHandleZone').onclick = () => closeDetail();
  document.getElementById('modalShare').onclick = (e) => shareEvent(ev, e.currentTarget);
  const againBtn = document.getElementById('modalAgain');
  if (againBtn) againBtn.onclick = () => surpriseMe();
  document.getElementById('modalSave').onclick = () => {
    // Just flip the heart in place and keep the details open — closing the
    // whole modal is only supposed to happen when tapping outside it. Saving
    // is instant (today's date, no picker); the date can be changed later
    // from the saved-date badge in list view.
    if (state.saved.has(ev.id)) {
      state.saved.delete(ev.id);
    } else {
      const today = todayIso();
      state.saved.set(ev.id, { start: today, end: today });
    }
    persistSaved();
    render();
  };
  // Keep the dots in sync while swiping through the gallery (if there's more
  // than one photo — a single-photo or no-photo event has no track to bind).
  const track = document.getElementById('galleryTrack');
  if (track) {
    const dots = modalEl.querySelectorAll('.gallery-dots .dot');
    if (dots.length) {
      let raf = null;
      track.addEventListener('scroll', () => {
        if (raf) return;
        raf = requestAnimationFrame(() => {
          raf = null;
          const i = Math.round(track.scrollLeft / track.clientWidth);
          dots.forEach((d, idx) => d.classList.toggle('active', idx === i));
        });
      }, { passive: true });
    }
  }
}
function closeDetail() { backdrop.classList.remove('open'); openDetailId = null; state.authModalOpen = false; syncBackGuard(); }

/* ===================== BACK BUTTON =====================
   Inside the installed Android app the system Back button walks the browser
   history. Without this, Back left the app (or jumped to an earlier page such
   as the privacy policy) instead of closing what's open. While any "layer" is
   showing (event details, sign-in, filters, pickers, city menu, or a tab other
   than Home), we keep exactly one extra history entry; Back pops it and we
   close the top layer instead of leaving. `var` (not let) on purpose: render()
   can run before this block is reached during start-up. */
var backGuarded = false;
var backSkip = 0;
function backLayerActive() {
  return backdrop.classList.contains('open') || state.filtersOpen || state.datePickerOpen ||
    state.saveDatePickerOpen || !!state.ageStepper || state.cityMenuOpen || state.tab !== 'home';
}
function syncBackGuard() {
  try {
    const want = backLayerActive();
    if (want && !backGuarded) { history.pushState({ mmLayer: true }, ''); backGuarded = true; }
    else if (!want && backGuarded) { backGuarded = false; backSkip++; history.back(); }
  } catch (e) { /* history API unavailable — Back just behaves as before */ }
}
function handleBack() {
  if (state.saveDatePickerOpen) { state.saveDatePickerOpen = false; render(); return; }
  if (state.datePickerOpen) { state.datePickerOpen = false; render(); return; }
  if (state.ageStepper) { state.ageStepper = null; render(); return; }
  if (state.cityMenuOpen) { state.cityMenuOpen = false; render(); return; }
  if (backdrop.classList.contains('open')) { closeDetail(); return; }
  if (state.filtersOpen) { state.filtersOpen = false; render(); return; }
  if (state.tab === 'profile' && state.profilePage) { state.profilePage = null; render(); resetScroll(); return; }
  if (state.tab !== 'home') { state.tab = 'home'; render(); resetScroll(); return; }
}
window.addEventListener('popstate', () => {
  if (backSkip > 0) { backSkip--; return; }
  backGuarded = false;
  handleBack();
  syncBackGuard();
});
backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeDetail(); });

/* ===================== EVENTS ===================== */
document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  syncSearchClear();
  render();
});
document.getElementById('searchClear').addEventListener('click', () => clearSearch());
contentEl.addEventListener('click', (e) => { if (e.target && e.target.closest && e.target.closest('.empty-clear')) clearSearch(); });
document.querySelectorAll('.navitem').forEach(btn => {
  btn.addEventListener('click', () => {
    const changed = state.tab !== btn.dataset.tab;
    state.tab = btn.dataset.tab;
    if (btn.dataset.tab === 'profile') state.profilePage = null;
    if (btn.dataset.tab === 'home' && state.search) {
      state.search = '';
      const si = document.getElementById('searchInput');
      if (si) si.value = '';
      syncSearchClear();
    }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    render();
    // Each tab starts at its top, not at the previous tab's scroll position.
    if (changed) resetScroll();
  });
});

/* ===================== INSTALL PROMPT ===================== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBanner').classList.remove('show');
});

/* ===================== SERVICE WORKER ===================== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

/* ===================== SPLASH SCREEN ===================== */
setTimeout(() => {
  const splash = document.getElementById('splashScreen');
  if (!splash) return;
  splash.classList.add('hide');
  setTimeout(() => splash.remove(), 550);
}, 1500);

/* ===================== INIT ===================== */
// Event data lives in events.json, fetched at runtime, instead of being baked
// into this file — daily content updates only need to touch that small data
// file, not the whole app. Falls back to a cached copy when offline, and
// never lets a data-load failure crash the page (EVENTS just stays []).
async function loadEventsAndInit() {
  // Not awaited: credits only matter when a detail view opens, so they must not delay first paint.
  fetch('photo_credits.json').then(r => r.ok ? r.json() : null).then(j => { if (j) PHOTO_CREDITS = j; }).catch(() => {});
  try {
    const res = await fetch('events.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('bad response ' + res.status);
    const data = await res.json();
    EVENTS = data;
    if ('caches' in window) {
      caches.open('pf-data-v1')
        .then(c => c.put('events.json', new Response(JSON.stringify(data), { headers: { 'Content-Type': 'application/json' } })))
        .catch(() => {});
    }
  } catch (err) {
    // Network failed (e.g. offline) — fall back to the last cached copy.
    try {
      if ('caches' in window) {
        const cache = await caches.open('pf-data-v1');
        const cached = await cache.match('events.json');
        if (cached) EVENTS = await cached.json();
      }
    } catch (e2) { /* leave EVENTS as [] */ }
  }

  // Reconcile a stored language that isn't valid for the stored city (e.g. after this
  // update introduced per-city languages) before the very first render.
  const validLangs = CITY_LANGS[state.city] || ['en'];
  if (!validLangs.includes(state.lang)) {
    state.lang = validLangs[0];
    localStorage.setItem('pf_lang', state.lang);
    document.documentElement.lang = state.lang;
  }
  // Shared-event link (?event=<id>): switch to that event's city and open it.
  let sharedEv = null;
  try {
    const sp = new URLSearchParams(location.search);
    const sid = sp.get('event');
    if (sid) {
      sharedEv = EVENTS.find(e => String(e.id) === sid) || null;
      sp.delete('event');
      const q = sp.toString();
      history.replaceState(history.state, '', location.pathname + (q ? '?' + q : '') + location.hash);
    }
  } catch (e) { sharedEv = null; }
  if (sharedEv && sharedEv.city !== state.city && CITIES.some(c => c.key === sharedEv.city)) {
    state.city = sharedEv.city;
    persistCity();
    const vl = CITY_LANGS[state.city] || ['en'];
    if (!vl.includes(state.lang)) { state.lang = vl[0]; localStorage.setItem('pf_lang', state.lang); document.documentElement.lang = state.lang; }
  }
  render();
  if (sharedEv) setTimeout(() => openDetail(sharedEv.id), 0);
}
// Start the app straight away; sign-in is attached once Firebase has loaded (if it can).
loadEventsAndInit();
loadFirebaseInBackground().then((ok) => {
  if (!ok) return;
  completeSignInFromLinkIfPresent().finally(() => {
    firebase.auth().onAuthStateChanged((user) => {
      state.user = user ? { email: user.email, uid: user.uid } : null;
      state.authResolved = true;
      render();
      updateGate();
      let pendingDelete = false;
      try { pendingDelete = !!user && localStorage.getItem('pf_pending_delete') === '1'; if (pendingDelete) localStorage.removeItem('pf_pending_delete'); } catch (e) {}
      if (pendingDelete) setTimeout(() => doDeleteAccount(), 400);
    });
  });
});
</script>
